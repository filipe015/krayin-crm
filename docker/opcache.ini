; PHP guarda o código já compilado em memória em vez de recompilar a cada requisição.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; confere se um arquivo mudou a cada 10 s (views do Blade são geradas em tempo de execução)
opcache.validate_timestamps=1
opcache.revalidate_freq=10

; menos consultas ao disco para achar arquivos (o Laravel carrega milhares)
realpath_cache_size=4096K
realpath_cache_ttl=600
